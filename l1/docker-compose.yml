name: lab1

services:
  db:
    image: redis:7-alpine
    container_name: db
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && [ ! -f /tmp/sick ]"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  app:
    build: ./app
    image: lab1-app:1.0
    environment:
      REDIS_HOST: db
    deploy:
      replicas: 2
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy

networks:
  frontend:
    name: lab1-frontend
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
  backend:
    name: lab1-backend
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1
